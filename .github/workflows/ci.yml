# Проверки на каждый push и pull request (ТЗ, раздел 10).
# Сторонние действия закреплены по хэшу коммита; версия — в комментарии.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Интерфейс — линтер, типы, тесты, сборка
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Уязвимости зависимостей (high и critical останавливают сборку)
        run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co

  database:
    name: База — миграции и тесты прав
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.119.0
      - name: Локальная база Supabase с нашими миграциями
        run: supabase start -x gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: RLS на всех таблицах и тесты прав
        run: supabase/tests/run.sh

  functions:
    name: Серверные функции — Deno и сквозной вход через Telegram
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.7
      - name: Типы, линтер, модульные тесты
        run: |
          deno check supabase/functions/auth-telegram/index.ts
          deno lint supabase/functions
          deno test supabase/functions
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.119.0
      - name: Локальный Supabase (база, вход, REST, шлюз, функции)
        run: supabase start -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,logflare,vector,supavisor
      - name: Сквозной вход через Telegram (тестовый токен, не настоящий бот)
        run: |
          printf '%s\n' 'TELEGRAM_BOT_TOKEN=123456789:TEST-token-for-unit-tests-only' 'ALLOWED_ORIGINS=https://dexauron.github.io' > "$RUNNER_TEMP/functions.env"
          supabase functions serve auth-telegram --env-file "$RUNNER_TEMP/functions.env" > "$RUNNER_TEMP/serve.log" 2>&1 &
          for _ in $(seq 1 60); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' -X OPTIONS http://127.0.0.1:54321/functions/v1/auth-telegram)" = 204 ] && break
            sleep 2
          done
          eval "$(supabase status -o env | grep -E '^(PUBLISHABLE_KEY|SECRET_KEY)=')"
          PUB="$PUBLISHABLE_KEY" SECRET="$SECRET_KEY" node supabase/tests/auth_telegram_e2e.mjs || { tail -n 50 "$RUNNER_TEMP/serve.log"; exit 1; }

  secrets:
    name: Поиск секретов (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks по всей истории
        run: >
          docker run --rm -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --redact --no-banner --exit-code 1
